<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BiteDash - Full-Stack Food Delivery Platform</title>
    <meta name="description" content="Production-grade food delivery platform with multi-role portals (Customer, Restaurant Partner, Delivery Partner, Admin), live order tracking, relational database, and AI assistance." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      // Gracefully satisfy Vite HMR WebSocket client in cloud sandbox environments
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          function ViteSafeWebSocket(url, protocols) {
            const isVite = (protocols === 'vite-hmr') ||
              (Array.isArray(protocols) && protocols.includes('vite-hmr')) ||
              (typeof url === 'string' && (url.includes('@vite') || url.includes('vite-hmr')));

            if (isVite) {
              const listeners = {};
              const dummy = {
                readyState: 1, // OPEN
                url: url,
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                CONNECTING: 0,
                OPEN: 1,
                CLOSING: 2,
                CLOSED: 3,
                addEventListener: function(type, listener) {
                  if (!listeners[type]) listeners[type] = [];
                  listeners[type].push(listener);
                  if (type === 'open') {
                    setTimeout(function() {
                      try { listener({ type: 'open', target: dummy }); } catch(e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(type, listener) {
                  if (listeners[type]) {
                    listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
                  }
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() { dummy.readyState = 3; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null,
              };

              setTimeout(function() {
                if (typeof dummy.onopen === 'function') {
                  try { dummy.onopen({ type: 'open', target: dummy }); } catch(e) {}
                }
              }, 0);

              return dummy;
            }
            return new NativeWebSocket(url, protocols);
          }

          ViteSafeWebSocket.prototype = NativeWebSocket.prototype;
          ViteSafeWebSocket.CONNECTING = 0;
          ViteSafeWebSocket.OPEN = 1;
          ViteSafeWebSocket.CLOSING = 2;
          ViteSafeWebSocket.CLOSED = 3;
          window.WebSocket = ViteSafeWebSocket;

          window.addEventListener('unhandledrejection', function(event) {
            if (event && event.reason && (
              String(event.reason).includes('WebSocket') ||
              (event.reason.message && event.reason.message.includes('WebSocket'))
            )) {
              event.preventDefault();
            }
          });
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
