version: '3.8'

services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=bitedash-super-secret-production-key-2026
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=bitedash
      - MYSQL_PASSWORD=bitedash123
      - MYSQL_DATABASE=bitedash_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: bitedash_db
      MYSQL_USER: bitedash
      MYSQL_PASSWORD: bitedash123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seeds/001_seed_data.sql:/docker-entrypoint-initdb.d/02-seeds.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'bitedash', '-pbitedash123']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
